<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Only the font files in this folder are visible, so figures render the same on any machine. Set by
     plotting_functions.R. conf.d/ is the rule set of the scRNAEditing conda environment (fontconfig 2.18): it maps
     Helvetica (R's text font) to Liberation Sans and Symbol (plotmath) to DejaVu Sans, and sets the hinting that the
     glyph outlines depend on. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <include ignore_missing="yes" prefix="relative">conf.d</include>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
